# Render Blueprint: free web server + free PostgreSQL database for DEScape.
# On render.com: New > Blueprint > pick this repository > Apply.
databases:
  - name: descape-db
    plan: free
    databaseName: descape
    user: descape

services:
  - type: web
    name: descape
    runtime: python
    plan: free
    buildCommand: pip install -r deploy/requirements-hosting.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn cipherbreak.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: descape-db
          property: connectionString
