{% load static icons %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no, date=no, email=no, address=no">
  <title>The 16-Round Escape · DEScape</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ asset_v }}">
  <link rel="stylesheet" href="{% static 'css/game.css' %}?v={{ asset_v }}">
  <link rel="icon" type="image/png" href="{% static 'img/favicon.png' %}">
</head>
<body class="game-page">
<div id="game" class="g-root" data-room="0">
  <!-- Game HUD -->
  <header class="hud" id="hud" aria-label="Game HUD">
    <div class="hud-l">
      <img class="hud-logo" src="{% static 'img/descape-logo.png' %}" alt="" aria-hidden="true">
      <div class="hud-loc"><b id="hud-room">MAIN LOBBY</b><span id="hud-obj">—</span></div>
    </div>
    <div class="hud-m">
      <div class="hud-stat"><small>SCORE</small><b id="hud-score">{{ attempt.score }}</b></div>
      <div class="hud-stat wide"><small>ESCAPE <span id="hud-pct">0%</span></small><span class="hud-bar"><i id="hud-bar"></i></span></div>
      <div class="hud-stat hidden" id="hud-timer-wrap"><small id="hud-timer-lab">TIME LEFT</small><b id="hud-timer">60:00</b></div>
      <div class="hud-stat rooms" id="hud-rooms" aria-label="Room locks"></div>
    </div>
    <nav class="hud-r" aria-label="Game menu">
      <button type="button" class="hbtn" id="b-hint" title="Hint (H)"><span>{% icon "lightbulb" %}</span><small>HINT</small></button>
      <button type="button" class="hbtn" id="b-inv" title="Inventory (I)"><span>{% icon "backpack" %}</span><small>ITEMS</small><em class="dot hidden" id="inv-dot"></em></button>
      <button type="button" class="hbtn" id="b-map" title="Map (M)"><span>{% icon "map" %}</span><small>MAP</small></button>
      <button type="button" class="hbtn" id="b-notes" title="Notebook (N)"><span>{% icon "notebook" %}</span><small>NOTES</small></button>
      <button type="button" class="hbtn" id="b-menu" title="Menu (Esc)"><span>{% icon "menu" %}</span><small>MENU</small></button>
    </nav>
  </header>

  <!-- World -->
  <div class="stage-area" id="stage-area">
    <div class="stage" id="stage">
      <canvas id="world" width="320" height="192" aria-label="Game world. Move with arrow keys or WASD, press Enter to open machines. Every machine can also be reached from the Map." role="img"></canvas>
      <div class="labels" id="labels" aria-hidden="true"></div>
      <span class="next-tag hidden" id="next-tag" aria-hidden="true">NEXT</span>
      <span class="press-tag hidden" id="press-tag" aria-hidden="true"><kbd>ENTER</kbd> to open</span>
      <div class="nova-bubble-w hidden" id="nova-say" role="status" aria-live="polite"><b>NOVA</b><span></span></div>
      <div class="prompt hidden" id="prompt" aria-live="polite"></div>
      <div class="banner hidden" id="banner" aria-live="assertive"></div>
      <div class="flow-pop hidden" id="flow-pop" role="dialog" aria-label="DES progress"></div>
      <div class="dialog hidden" id="dialog" role="dialog" aria-label="NOVA">
        <div class="portrait" aria-hidden="true"><i></i></div>
        <div class="dbody"><b class="who">NOVA</b><p id="dialog-text"></p></div>
        <div class="dbtns"><button type="button" class="pxbtn" id="dialog-next">▶ NEXT</button><button type="button" class="pxbtn ghost small" id="dialog-skip">SKIP</button></div>
      </div>
      <div class="touchpad" id="touchpad" aria-hidden="true">
        <button data-k="arrowup">▲</button><button data-k="arrowleft">◀</button><button data-k="e" class="use" aria-label="Open machine">OPEN</button><button data-k="arrowright">▶</button><button data-k="arrowdown">▼</button>
      </div>
    </div>
  </div>

  <!-- Machine panel (opens when you use a terminal) -->
  <div class="machine-back hidden" id="machine-back">
    <section class="machine" id="machine" role="dialog" aria-modal="true" aria-labelledby="mc-title">
      <header class="mc-head">
        <span class="screw tl"></span><span class="screw tr"></span>
        <div class="mc-plate"><small id="mc-kicker">ROOM 1 · STEP 1</small><h2 id="mc-title">Machine</h2></div>
        <button type="button" class="pxbtn ghost small" id="mc-close" aria-label="Close machine">✕ LEAVE</button>
      </header>
      <div class="mc-task"><span class="nova-face" aria-hidden="true"></span><div><p id="mc-task"></p><p class="tiny muted" id="mc-nova"></p></div></div>
      <div class="mc-lesson hidden" id="mc-lesson" aria-live="polite"></div>
      <div class="mc-body" id="mc-body"></div>
      <div class="mc-feedback" id="mc-feedback" role="status" aria-live="polite"></div>
      <div class="mc-hints" id="mc-hints"></div>
      <footer class="mc-foot" id="mc-foot">
        <button type="button" class="pxbtn amber" id="mc-hint">{% icon "lightbulb" %} HINT</button>
        <button type="button" class="pxbtn ghost" id="mc-tut">{% icon "book-open" %} LESSON</button>
        <span class="grow"></span>
        <button type="button" class="pxbtn go" id="mc-engage">{% icon "arrow-right" %} NEXT</button>
      </footer>
      <span class="stamp hidden" id="mc-stamp">ACCESS GRANTED</span>
    </section>
  </div>

  <!-- One sound switch, always in the corner: mutes or unmutes all game audio -->
  <button type="button" class="mute-btn" id="b-mute" aria-pressed="false" title="Mute / unmute sound"><span aria-hidden="true">{% icon "volume-2" %}</span><b>SOUND ON</b></button>

  <!-- Title screen -->
  <div class="title-screen" id="title">
    <div class="title-inner">
      <h1 class="t-logo"><img src="{% static 'img/descape-logo.png' %}" alt="DES"><span class="t-word">DEScape</span><small>THE 16-ROUND ESCAPE</small></h1>
      <div class="t-menu" id="t-menu">
        <button type="button" class="pxbtn big go" id="t-start">▶ START</button>
        <button type="button" class="pxbtn" id="t-how">HOW TO PLAY</button>
        <a class="pxbtn ghost small" href="{% url 'dashboard' %}">⟵ DASHBOARD</a>
      </div>
      <p class="t-press" role="status"></p>
    </div>
  </div>

  <form id="restart-form" method="post" action="{% url 'new_adventure' %}" class="hidden">{% csrf_token %}<input type="hidden" name="direction" value="{{ attempt.params.direction|default:'encrypt' }}"><input type="hidden" name="mode" value="{% if attempt.mode == 'demo' %}guided{% else %}{{ attempt.mode }}{% endif %}"></form>
</div>
{{ boot|json_script:"cb-boot" }}
<script src="{% static 'js/icons.js' %}?v={{ asset_v }}"></script>
<script src="{% static 'js/common.js' %}?v={{ asset_v }}"></script>
<script>window.CB_BOOT = JSON.parse(document.getElementById("cb-boot").textContent);</script>
<script src="{% static 'js/trace.js' %}?v={{ asset_v }}"></script>
<script src="{% static 'js/world.js' %}?v={{ asset_v }}"></script>
<script src="{% static 'js/machines.js' %}?v={{ asset_v }}"></script>
<script src="{% static 'js/lessons.js' %}?v={{ asset_v }}"></script>
<script src="{% static 'js/play.js' %}?v={{ asset_v }}"></script>
</body>
</html>
